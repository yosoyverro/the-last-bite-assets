name: Audit gameplay GLBs

on:
  push:
    branches: [main]
    paths:
      - 'models/gameplay items/*.glb'
      - 'scripts/audit-gameplay-glbs.mjs'
      - '.github/workflows/audit-gameplay-glbs.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Audit GLB textures
        run: node scripts/audit-gameplay-glbs.mjs
